<svg xmlns="http://www.w3.org/2000/svg" width="920" height="164" viewBox="0 0 920 164" role="img" aria-label="How BreakALeg works: scan, trace, verify, report" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>How BreakALeg works: scan, trace, verify, report</title>
<rect x="0.0" y="16" width="200" height="132" rx="12" fill="#151b23" stroke="#3d444d"/>
<circle cx="30.0" cy="50" r="14" fill="#ff7b72"/>
<text x="30.0" y="55" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">1</text>
<text x="54.0" y="56" font-size="18" font-weight="700" fill="#e6edf3">Scan</text>
<text x="18.0" y="96" font-size="13" fill="#9198a1">Offline helpers map your</text>
<text x="18.0" y="116" font-size="13" fill="#9198a1">stack, keys, rules, limits</text>
<path d="M208.0 82.0 h22" stroke="#9198a1" stroke-width="1.5"/>
<path d="M226.0 77.0 l6 5 l-6 5" fill="none" stroke="#9198a1" stroke-width="1.5"/>
