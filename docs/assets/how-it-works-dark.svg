<text x="294.0" y="56" font-size="18" font-weight="700" fill="#e6edf3">Trace</text>
<text x="258.0" y="96" font-size="13" fill="#9198a1">Your agent follows each</text>
<text x="258.0" y="116" font-size="13" fill="#9198a1">lead from app to database</text>
<path d="M448.0 82.0 h22" stroke="#9198a1" stroke-width="1.5"/>
<path d="M466.0 77.0 l6 5 l-6 5" fill="none" stroke="#9198a1" stroke-width="1.5"/>
<rect x="480.0" y="16" width="200" height="132" rx="12" fill="#151b23" stroke="#3d444d"/>
<circle cx="510.0" cy="50" r="14" fill="#ff7b72"/>
<text x="510.0" y="55" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">3</text>
<text x="534.0" y="56" font-size="18" font-weight="700" fill="#e6edf3">Verify</text>
<text x="498.0" y="96" font-size="13" fill="#9198a1">Optional safe checks on</text>
<text x="498.0" y="116" font-size="13" fill="#9198a1">local or staging only</text>
<path d="M688.0 82.0 h22" stroke="#9198a1" stroke-width="1.5"/>
<path d="M706.0 77.0 l6 5 l-6 5" fill="none" stroke="#9198a1" stroke-width="1.5"/>
<rect x="720.0" y="16" width="200" height="132" rx="12" fill="#3a1d1b" stroke="#ff7b72"/>
<circle cx="750.0" cy="50" r="14" fill="#ff7b72"/>
<text x="750.0" y="55" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">4</text>
<text x="774.0" y="56" font-size="18" font-weight="700" fill="#e6edf3">Report</text>
<text x="738.0" y="96" font-size="13" fill="#9198a1">Ranked by what to fix</text>
<text x="738.0" y="116" font-size="13" fill="#9198a1">before launch</text>
